<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Página 1</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">pagina1</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button routerLink="/home" expand="block">Início</ion-button>
  <ion-button routerLink="/pagina2" expand="block">Página 2</ion-button>

  <ion-list>
    <ion-item *ngFor="let filme of filmes"> <!-- Gera um <ion-item> para cada filme -->
      <ion-thumbnail slot="start">
        <img [src]="'https://image.tmdb.org/t/p/w500' + filme.poster_path" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ filme.title }}</h2>
        <p>{{ filme.overview }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
